name: Collect 200 additional admissions slots

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - ".github/workflows/additional-200-slots.yml"
  workflow_dispatch:

concurrency:
  group: retire-additional-200-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Slow crawler retired; official ADIGA university-result API collector replaces it."
