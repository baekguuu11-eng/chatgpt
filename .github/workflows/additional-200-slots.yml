name: Collect 200 additional admissions slots

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - "admissions_archive/collect_additional_200_slots.py"
      - ".github/workflows/additional-200-slots.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admissions_archive/collect_additional_200_slots.py"
      - ".github/workflows/additional-200-slots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests beautifulsoup4
      - name: Collect 200 unique university-year slots
        run: python admissions_archive/collect_additional_200_slots.py
      - name: Validate exact slot count and uniqueness
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('additional_200_output/additional_200_slots')
          rows = list(csv.DictReader((root/'slot_manifest.csv').open(encoding='utf-8-sig')))
          keys = {(r['university'], int(r['admission_year'])) for r in rows}
          summary = json.loads((root/'summary.json').read_text(encoding='utf-8'))
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert len(rows) == 200, len(rows)
          assert len(keys) == 200, len(keys)
          assert all(2020 <= year <= 2026 for _, year in keys)
          assert summary['selected_unique_slots'] == 200
          PY
      - name: Package result
        run: |
          cd additional_200_output
          zip -r -9 ../additional-200-unique-admissions-slots.zip additional_200_slots
      - uses: actions/upload-artifact@v4
        with:
          name: additional-200-unique-admissions-slots
          path: additional-200-unique-admissions-slots.zip
          if-no-files-found: error
          retention-days: 7
