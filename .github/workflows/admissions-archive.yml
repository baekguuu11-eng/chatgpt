name: Collect official admissions archives

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pypdf

      - name: Probe ADIGA official 2028 archive metadata
        run: python admissions_archive/probe_adiga_search.py

      - name: Download and extract official 2028 archives
        run: python admissions_archive/download_official_archives.py

      - name: Download official ADIGA admissions result files
        run: python admissions_archive/download_adiga_results.py

      - name: Collect and verify 500 target slots
        run: python admissions_archive/fast_collect_total_500.py

      - name: Validate exact slot count and uniqueness
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('total500_output/total_500_slots')
          rows = list(csv.DictReader((root / 'slot_manifest.csv').open(encoding='utf-8-sig')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert len(rows) == 500, len(rows)
          assert len({(r['university'], r['year']) for r in rows}) == 500
          assert summary['selected_slots'] == 500
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Package 500-slot archive
        run: |
          cd total500_output
          zip -r -9 ../admissions-total-500-slots.zip total_500_slots

      - name: Upload 500-slot archive
        uses: actions/upload-artifact@v4
        with:
          name: admissions-total-500-slots
          path: admissions-total-500-slots.zip
          if-no-files-found: error
          retention-days: 7
