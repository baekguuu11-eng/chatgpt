name: Collect official admissions archives

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Probe ADIGA official 2028 archive metadata
        run: python admissions_archive/probe_adiga_search.py

      - name: Probe ADIGA official admissions result archives
        run: python admissions_archive/probe_adiga_results.py

      - name: Download and extract official 2028 archives
        run: python admissions_archive/download_official_archives.py

      - name: Show collection summary
        if: always()
        run: |
          echo '--- admissions-result probe ---'
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('output/adiga_result_probe.json')
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              print('result attachments:', data.get('count'))
              for row in data.get('attachments', [])[:100]:
                  print(row.get('query_year'), row.get('atchFileNm'), row.get('downloadUrl'))
          PY
          echo '--- summary.json ---'
          cat output/summary.json || true
          echo '--- archive_download_log.json ---'
          cat output/archive_download_log.json || true

      - name: Package collected files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('output')
          if root.exists():
              shutil.make_archive('official-admissions-archive', 'zip', root)
          PY

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-admissions-archive
          path: official-admissions-archive.zip
          if-no-files-found: error
          retention-days: 7
