name: Collect official admissions archives

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Download and extract official archives
        run: python admissions_archive/download_official_archives.py

      - name: Show collection summary
        if: always()
        run: |
          find output -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort | head -200
          echo '--- summary.json ---'
          cat output/summary.json || true
          echo '--- archive_download_log.json ---'
          cat output/archive_download_log.json || true

      - name: Package collected files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('output')
          if root.exists():
              shutil.make_archive('official-admissions-archive', 'zip', root)
          PY

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-admissions-archive
          path: official-admissions-archive.zip
          if-no-files-found: error
          retention-days: 7
