name: Collect official admissions archives

on:
  push:
    branches:
      - agent/admissions-archive-300
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admissions_archive/**"
      - ".github/workflows/admissions-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Probe ADIGA official 2028 archive metadata
        run: python admissions_archive/probe_adiga_search.py

      - name: Download and extract official 2028 archives
        run: python admissions_archive/download_official_archives.py

      - name: Download official 2020-2026 admissions result files
        run: python admissions_archive/download_adiga_results.py

      - name: Build combined verified summary
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          plans = json.loads(Path('output/summary.json').read_text(encoding='utf-8'))
          results = json.loads(Path('output/result_summary.json').read_text(encoding='utf-8'))
          combined = {
              '2028_plan_files': plans['extracted_files'],
              '2028_unique_content': plans['unique_content_files'],
              'result_files': results['valid_files'],
              'result_unique_content': results['unique_valid_content'],
              'total_files': plans['extracted_files'] + results['valid_files'],
              'total_unique_content': plans['unique_content_files'] + results['unique_valid_content'],
              'results_by_year': results['by_year'],
              'plan_failures': plans['failures'],
              'result_failures': results['failures'],
          }
          Path('output/combined_summary.json').write_text(
              json.dumps(combined, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(combined, ensure_ascii=False, indent=2))
          if combined['total_files'] < 300:
              raise SystemExit(f"Only {combined['total_files']} verified files; need at least 300")
          PY

      - name: Show collection summary
        if: always()
        run: |
          echo '--- combined_summary.json ---'
          cat output/combined_summary.json || true
          echo '--- result_summary.json ---'
          cat output/result_summary.json || true
          echo '--- 2028 summary.json ---'
          cat output/summary.json || true

      - name: Package collected files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('output')
          if root.exists():
              shutil.make_archive('official-admissions-archive-300', 'zip', root)
          PY

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-admissions-archive-300
          path: official-admissions-archive-300.zip
          if-no-files-found: error
          retention-days: 7
