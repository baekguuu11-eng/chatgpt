name: Bing RSS probe
on:
  push:
    branches: [agent/admissions-archive-300]
    paths:
      - admissions_archive/bing_probe.py
      - .github/workflows/bing-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python admissions_archive/bing_probe.py
